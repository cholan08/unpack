<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Unpacked — full-stack development, one animated diagram at a time</title>
    <meta name="description" content="A visual course on MERN full-stack development. Every concept is an animated diagram you step through — from the browser, through the server, to the database and back." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- link previews (set an absolute URL for og:image once the site has a domain) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Unpacked" />
    <meta property="og:title" content="Unpacked — full-stack development, one animated diagram at a time" />
    <meta property="og:description" content="54 visual lessons on MERN full-stack development: every concept is an animated diagram you step through, with the real code beside it." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#eceae4" />
    <script>
      // resolve the theme before first paint (saved choice, else the OS) so the page never flashes
      (function () {
        var t = null;
        try { t = localStorage.getItem('unpacked:theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
